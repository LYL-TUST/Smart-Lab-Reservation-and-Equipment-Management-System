name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 也支持手动触发（方便测试）
  workflow_dispatch:

jobs:
  review:
    permissions:           
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # 支持 Python / Java / Vue / JS / TS 多语言审查

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，否则 git diff 拿不到 base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install unidiff openai requests tree-sitter tree-sitter-python tree-sitter-java tree-sitter-javascript tree-sitter-typescript

      - name: Generate diff
        run: |
          # 对比 PR 的 base 和 head 分支
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Run AI Code Review
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 首选用真实 LLM 审查；如果 API Key 没配，降级为 dry-run
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python main.py --diff /tmp/pr.diff --live --compress ast -o review.md
          else
            echo "⚠️  DEEPSEEK_API_KEY not set — falling back to dry-run mode"
            python main.py --diff /tmp/pr.diff --compress ast -o review.md
          fi

      - name: Post review summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review.md', 'utf8');

            // 只贴前 5000 字符（GitHub comment 有长度限制，完整报告看 artifact）
            const summary = report.length > 5000
              ? report.slice(0, 5000) + '\n\n---\n*（完整报告见下方 Artifact）*'
              : report;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary,
            });

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review-report
          path: review.md
          retention-days: 7
